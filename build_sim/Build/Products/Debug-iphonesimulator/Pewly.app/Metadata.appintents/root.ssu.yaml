apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.duolaameng.pewly
    intents:
    - metadata:
        name: RecordSermonIntent_0
        title: Record a sermon
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Record a sermon with ${+applicationName}'
          - '{${+prefix} }Take sermon notes in ${+applicationName}'
          - '{${+prefix} }Start ${+applicationName} recording'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Pewly
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
